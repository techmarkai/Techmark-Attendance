generate_report:
  name: Generate report
  description: >-
    Write an Excel report. Admin only. Visitor reports never contain a unique
    visitor figure while the camera's dedup counter remains unverified.
  fields:
    kind:
      name: Report
      required: true
      selector:
        select:
          options:
            - label: Daily attendance
              value: daily_attendance
            - label: Monthly attendance
              value: monthly_attendance
            - label: Daily visitors
              value: daily_visitors
            - label: Monthly visitors
              value: monthly_visitors
    date:
      name: Date
      description: Any date inside the period. Defaults to today.
      selector:
        date:

recalculate:
  name: Recalculate a period
  description: >-
    Re-derive attendance for a past period after changing HR policy. Raw camera
    events are never modified; the request is written to the audit log.
  fields:
    start:
      name: First date
      required: true
      selector:
        date:
    end:
      name: Last date
      required: true
      selector:
        date:
    reason:
      name: Reason
      description: Recorded in the audit log.
      required: true
      selector:
        text:
