generate_report:
  name: Generate report
  description: >-
    Write an Excel report. Admin only. Presence figures are recognition-based
    and are not verified attendance; camera statistics include employees.
  fields:
    kind:
      name: Report
      required: true
      selector:
        select:
          options:
            - label: Daily presence
              value: daily_presence
            - label: Monthly presence
              value: monthly_presence
            - label: Camera statistics
              value: camera_statistics
    date:
      name: Date
      description: Any date inside the period. Defaults to today.
      selector:
        date:

export_presence:
  name: Export presence CSV
  description: Recognised-presence CSV for a date range. Admin only.
  fields:
    start: {name: First date, required: true, selector: {date: }}
    end: {name: Last date, required: true, selector: {date: }}

recalculate:
  name: Recalculate a period
  description: >-
    Re-derive presence statuses for a past period after a calendar change. Raw
    events and stored timestamps are never modified; the request is audited.
  fields:
    start: {name: First date, required: true, selector: {date: }}
    end: {name: Last date, required: true, selector: {date: }}
    reason: {name: Reason, required: true, selector: {text: }}

list_libraries:
  name: List camera face libraries
  description: Read-only summary of the camera's face libraries. Never writes.
